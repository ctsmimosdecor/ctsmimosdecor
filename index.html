<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - CTSMimosdecor</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; }
        .login-box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; }
        button { width: 100%; padding: 10px; background: #E8527A; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>CTSMimosdecor-CRM</h2>
        <input type="email" id="email" placeholder="Seu e-mail">
        <input type="password" id="senha" placeholder="Sua senha">
        <button onclick="fazerLogin()">Entrar</button>
    </div>
<script type="module">
  // Importa as funções do Firebase (SDK Modular)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // Sua configuração (aquela que você copiou do Firebase)
  const firebaseConfig = {
    apiKey: "AIzaSyB_ZIBPQnAbp7T5oVa6P8Sa67RamfU1vac",
    authDomain: "ctsmimosdecor-crm.firebaseapp.com",
    projectId: "ctsmimosdecor-crm",
    storageBucket: "ctsmimosdecor-crm.firebasestorage.app",
    messagingSenderId: "429431424483",
    appId: "1:429431424483:web:0230a142c346f37e758cd6",
    measurementId: "G-18F9TH4NX5"
  };

  // Inicializa o Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // A função que o seu botão "Entrar" vai chamar
  window.fazerLogin = function() {
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;

    signInWithEmailAndPassword(auth, email, senha)
      .then((userCredential) => {
        // Se o login for válido, ele te manda para o CRM
        window.location.href = "crm.html";
      })
      .catch((error) => {
        // Se a senha estiver errada, avisa o usuário
        alert("E-mail ou senha incorretos.");
      });
  }
</script>
</body>
</html>
